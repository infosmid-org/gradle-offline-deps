# Publishes SNAPSHOT versions to GitHub Packages.
# This workflow runs for each push to main. It uses the GITHUB_TOKEN. It does not use other secrets.
name: Publish snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make sure that the version is a SNAPSHOT
        run: |
          VERSION=$(./gradlew -q properties --property version | sed -n 's/^version: //p')
          echo "Version is ${VERSION}"
          if [[ "${VERSION}" != *-SNAPSHOT ]]; then
            echo "::error::The version on main must end with -SNAPSHOT. Found ${VERSION}."
            exit 1
          fi

      - name: Build, test and publish to GitHub Packages
        run: ./gradlew build publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
